[package]
name = "app"
version = "0.1.0"
description = "Ponder — Desktop Study Console"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Phase 1 — Canvas LMS (HTTP client, rustls-tls to avoid OpenSSL on Windows)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
# Async runtime for the blocker loop + reqwest
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# Phase 7 — app blocker kill-loop (process enumeration + kill)
sysinfo = "0.32"
