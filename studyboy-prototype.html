<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d12" />
  <title>StudyBoy — Premium Study Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/design.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <!-- Ambient background -->
  <div class="ambient" aria-hidden="true">
    <div class="ambient__blob ambient__blob--1"></div>
    <div class="ambient__blob ambient__blob--2"></div>
    <div class="ambient__blob ambient__blob--3"></div>
    <div class="ambient__grain"></div>
  </div>

  <!-- App shell -->
  <div class="app" id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <div class="brand__mark">
          <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <path d="M6 7c0-1.1.9-2 2-2h10a6 6 0 0 1 6 6v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7Z" fill="url(#g1)" opacity=".18"/>
            <path d="M9 8h8.5A4.5 4.5 0 0 1 22 12.5V24" stroke="url(#g2)" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M9 8v15" stroke="url(#g3)" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="22" cy="12.5" r="2.4" fill="#7c9cff"/>
            <defs>
              <linearGradient id="g1" x1="6" y1="5" x2="24" y2="27"><stop stop-color="#7c9cff"/><stop offset="1" stop-color="#b18cff"/></linearGradient>
              <linearGradient id="g2" x1="9" y1="8" x2="22" y2="24"><stop stop-color="#8aa2ff"/><stop offset="1" stop-color="#c4a7ff"/></linearGradient>
              <linearGradient id="g3" x1="9" y1="8" x2="9" y2="23"><stop stop-color="#7c9cff"/><stop offset="1" stop-color="#5b6fff"/></linearGradient>
            </defs>
          </svg>
        </div>
        <div class="brand__text">
          <span class="brand__name">StudyBoy</span>
          <span class="brand__tag">Study suite</span>
        </div>
      </div>

      <nav class="nav" aria-label="Primary">
        <button class="nav__item is-active" data-route="dashboard">
          <svg viewBox="0 0 24 24" class="nav__icon"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6v-9h-6v9Zm0-16v5h6V4h-6Z" fill="currentColor"/></svg>
          <span>Dashboard</span>
        </button>
        <button class="nav__item" data-route="focus">
          <svg viewBox="0 0 24 24" class="nav__icon"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm1-13h-2v6l5 3 1-1.7-4-2.3V7Z" fill="currentColor"/></svg>
          <span>Focus Timer</span>
        </button>
        <button class="nav__item" data-route="flashcards">
          <svg viewBox="0 0 24 24" class="nav__icon"><path d="M4 4h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm2 14h10v2H6v-2Z" fill="currentColor"/></svg>
          <span>Flashcards</span>
        </button>
        <button class="nav__item" data-route="notes">
          <svg viewBox="0 0 24 24" class="nav__icon"><path d="M5 3h9l5 5v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Zm8 1.5V9h4.5L13 4.5Z" fill="currentColor"/></svg>
          <span>Notes</span>
        </button>
        <button class="nav__item" data-route="analytics">
          <svg viewBox="0 0 24 24" class="nav__icon"><path d="M4 20V4h2v14h14v2H4Zm4-4v-5h2v5H8Zm4 0V8h2v8h-2Zm4 0v-3h2v3h-2Z" fill="currentColor"/></svg>
          <span>Analytics</span>
        </button>
      </nav>

      <div class="sidebar__footer">
        <div class="streak-card">
          <div class="streak-card__icon">🔥</div>
          <div class="streak-card__body">
            <div class="streak-card__value" id="streakValue">0</div>
            <div class="streak-card__label">day streak</div>
          </div>
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" class="theme-toggle__sun"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5h1v3h-1V2Zm0 17h1v3h-1v-3ZM2 12v-1h3v1H2Zm17 0v-1h3v1h-3ZM4.2 4.2l.7-.7 2.1 2.1-.7.7-2.1-2.1Zm12 12 .7-.7 2.1 2.1-.7.7-2.1-2.1ZM19.8 4.2l-.7-.7-2.1 2.1.7.7 2.1-2.1Zm-12 12-.7-.7-2.1 2.1.7.7 2.1-2.1Z" fill="currentColor"/></svg>
          <svg viewBox="0 0 24 24" class="theme-toggle__moon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" fill="currentColor"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn topbar__menu" id="menuToggle" aria-label="Toggle menu">
          <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6Zm0 5h18v2H3v-2Zm0 5h18v2H3v-2Z" fill="currentColor"/></svg>
        </button>
        <div class="topbar__title" id="viewTitle">Dashboard</div>
        <div class="topbar__spacer"></div>
        <div class="topbar__search">
          <svg viewBox="0 0 24 24"><path d="M10 4a6 6 0 1 0 3.5 10.9l4.3 4.3 1.4-1.4-4.3-4.3A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z" fill="currentColor"/></svg>
          <input type="text" placeholder="Search anything…" id="globalSearch" />
          <kbd>⌘K</kbd>
        </div>
        <button class="icon-btn" id="notifBtn" aria-label="Notifications">
          <svg viewBox="0 0 24 24"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-5-1.5-1.5V10a5.5 5.5 0 0 0-4-5.3V4a1.5 1.5 0 0 0-3 0v.7A5.5 5.5 0 0 0 6.5 10v5.5L5 17v1h14v-1Z" fill="currentColor"/></svg>
          <span class="dot"></span>
        </button>
        <div class="avatar" title="You">SB</div>
      </header>

      <div class="view" id="view"></div>
    </main>
  </div>

  <!-- Toast container -->
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="js/store.js"></script>
  <script src="js/router.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
